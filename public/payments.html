<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Payments | Brayn Microfinance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <div data-app-shell></div>
      <main class="page">
        <div class="container stack">
          <header class="page-header">
            <div>
              <p class="eyebrow">Collections</p>
              <h1>Payments</h1>
              <p class="lede">Settled receipts are allocated to the oldest unpaid installments.</p>
            </div>
            <button type="button" class="btn btn-secondary" id="exportPayments">Export CSV</button>
          </header>

          <section class="kpi-row">
            <article class="kpi"><strong id="stat-today">—</strong><span>Collected today</span></article>
            <article class="kpi"><strong id="stat-count">—</strong><span>Receipts today</span></article>
            <article class="kpi"><strong id="stat-pending">—</strong><span>Pending review</span></article>
            <article class="kpi"><strong id="stat-total">—</strong><span>All payments</span></article>
          </section>

          <section class="layout-2">
            <article class="panel">
              <div class="panel-title"><h2>Record payment</h2></div>
              <form id="paymentForm" class="form-grid">
                <label class="full">Linked loan
                  <select name="loanId" id="loanId">
                    <option value="">No linked loan</option>
                  </select>
                </label>
                <p class="tiny-note full" id="suggestedDue" hidden></p>
                <label>Customer name<input type="text" name="customerName" id="customerName" placeholder="Needed if no loan selected" /></label>
                <label>Channel
                  <select name="channel">
                    <option>M-Pesa</option>
                    <option>Bank transfer</option>
                    <option>Paybill</option>
                    <option>Cash</option>
                    <option>Check-off</option>
                  </select>
                </label>
                <label>Amount (KES)<input type="number" name="amount" id="paymentAmount" min="1" step="0.01" required /></label>
                <label>Reference<input type="text" name="reference" placeholder="MPX-1001" /></label>
                <label>Status
                  <select name="status">
                    <option>Settled</option>
                    <option>Pending</option>
                    <option>Failed</option>
                  </select>
                </label>
                <button class="btn btn-primary full" type="submit">Save payment</button>
              </form>
              <p id="paymentMessage" class="success-text" aria-live="polite"></p>
            </article>

            <article class="panel">
              <div class="panel-title"><h2>Recent payments</h2></div>
              <form id="paymentFilters" class="toolbar">
                <input type="search" id="paymentSearch" placeholder="Search customer, reference, loan" />
                <select id="paymentChannel">
                  <option value="">All channels</option>
                  <option>M-Pesa</option>
                  <option>Bank transfer</option>
                  <option>Paybill</option>
                  <option>Cash</option>
                  <option>Check-off</option>
                </select>
                <select id="paymentStatus">
                  <option value="">All statuses</option>
                  <option>Settled</option>
                  <option>Pending</option>
                  <option>Failed</option>
                </select>
                <input type="date" id="paymentDate" title="Payment date" />
                <button class="btn btn-secondary" type="button" id="paymentToday">Today</button>
                <button class="btn btn-secondary" type="submit">Filter</button>
              </form>
              <div class="table-wrap" style="margin-top: 0.85rem;">
                <table class="data-table" id="paymentTable">
                  <thead>
                    <tr>
                      <th>ID</th>
                      <th>Loan</th>
                      <th>Customer</th>
                      <th>Channel</th>
                      <th>Amount</th>
                      <th>Status</th>
                      <th>Actions</th>
                    </tr>
                  </thead>
                  <tbody></tbody>
                </table>
              </div>
              <div id="paymentPager"></div>
            </article>
          </section>
        </div>
      </main>
      <footer class="footer container">© 2026 Brayn Microfinance</footer>
    </div>
    <script src="/js/common.js"></script>
    <script src="/js/payments.js"></script>
  </body>
</html>
