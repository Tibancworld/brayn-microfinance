services:
  - type: web
    name: brayn-microfinance
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /login.html
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
    disk:
      name: brayn-data
      mountPath: /app/data
      sizeGB: 1
